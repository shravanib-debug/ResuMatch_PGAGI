services:
  - type: web
    name: resumatch-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
